name: Retitle release

on:
  push:
    paths:
      - .github/retitle-release

permissions:
  contents: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - name: Set release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --repo gonejack/EMLQuickLook --title v1.0.0
