name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="EMLQuickLook-${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/EMLQuickLook.app "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUM" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUM" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
